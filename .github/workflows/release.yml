name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to build (e.g. v0.1.0)"
        required: false
        default: "v0.1.0-dev"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller==6.11.1 pytest
          python -m pytest -q

      - name: Build portable exe
        run: python -m PyInstaller --noconfirm AulaControl.spec

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Sync version into Inno script
        shell: bash
        run: |
          VER="${GITHUB_REF_NAME#v}"
          if [[ "$GITHUB_REF_TYPE" != "tag" ]]; then VER="${{ inputs.tag }}"; VER="${VER#v}"; fi
          sed -i "s/#define MyAppVersion \".*\"/#define MyAppVersion \"$VER\"/" installer/aula-control.iss
          echo "VERSION=$VER" >> "$GITHUB_ENV"

      - name: Compile installer
        run: |
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' installer\aula-control.iss

      - name: Rename portable artifact
        shell: bash
        run: |
          mkdir -p release
          cp dist/Aula-Control-Portable.exe "release/Aula-Control-Portable.exe"
          cp dist/Aula-Control-Setup.exe "release/Aula-Control-Setup.exe"
          ls -la release

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aula-control-windows
          path: release/*

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/Aula-Control-Setup.exe
            release/Aula-Control-Portable.exe
          body_path: RELEASE_NOTES.md
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
